[project]
name = "reel"
version = "0.1.0"
description = "A modern, low-latency desktop media player"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyside6>=6.12.0",
    "python-vlc>=3.0.21203",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reel"]

[tool.uv]
package = true
